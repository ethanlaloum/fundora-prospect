[project]
name = "fundora-prospect"
version = "0.1.0"
description = "Detection et qualification de prospects investisseurs a partir des publications legales BODACC"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundora_prospect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests reseau sont exclus par defaut. Pour les lancer :
#   pytest -m network
addopts = "-m 'not network'"
markers = [
    "network: test effectuant un appel reseau reel vers une API publique",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
