[project]
name = "fundora-prospect"
version = "0.2.0"
description = "Detection et qualification de prospects investisseurs a partir des publications legales BODACC"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "mcp>=2.0",
]

# Point d'entree du serveur MCP, reference par `.mcp.json`. Un script installe
# est plus robuste qu'un `python -m` : il ne depend ni du cwd ni du PYTHONPATH.
[project.scripts]
fundora-prospect-mcp = "fundora_prospect.mcp_server:main"

[project.optional-dependencies]
# La surface web est OPTIONNELLE. Le plugin Claude Code n'en a pas besoin, et
# le coeur encore moins : `api.py` en depend, rien d'autre. Un `pip install`
# nu doit continuer a donner un serveur MCP fonctionnel sans tirer starlette.
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    # Lecture du frontmatter des SKILL.md dans les tests du plugin.
    "pyyaml>=6.0",
    # `dev` inclut `web` : les tests de l'API font partie de la suite, et une
    # suite qui saute des tests selon ce qui est installe ne prouve rien.
    "fundora-prospect[web]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fundora_prospect"]

# `ponderation.toml` vit DANS le paquet, a `src/fundora_prospect/config/`.
#
# Il etait auparavant a la racine et injecte par `force-include`. C'etait un
# piege : en installation editable, hatchling materialisait un dossier
# `fundora_prospect/config/` dans site-packages, qui MASQUAIT le paquet
# editable et cassait tout import hors pytest. Une seule source, un seul
# emplacement, aucun masquage possible.
#
# Le fichier reste un TOML lisible et modifiable sans toucher au code, et
# `FUNDORA_PONDERATION` permet d'en designer un autre.

[tool.pytest.ini_options]
testpaths = ["tests"]
# `src` pour le package, `.` pour `tools/` (recorder de fixtures et vocabulaire
# synthetique partages avec les tests).
pythonpath = ["src", "."]
# Les tests reseau sont exclus par defaut. Pour les lancer :
#   pytest -m network
addopts = "-m 'not network'"
markers = [
    "network: test effectuant un appel reseau reel vers une API publique",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Le lexique est un bloc de texte : plus lisible et plus facile a etendre
# qu'une liste de litteraux.
"tools/vocabulaire.py" = ["SIM905"]
# Le recorder doit ajuster sys.path avant d'importer le package.
"tools/record_fixtures.py" = ["E402"]
