# Grille de ponderation — A DIRE D'EXPERT
#
# Ces poids sont des HYPOTHESES COMMERCIALES, pas des coefficients appris.
# Aucune donnee de conversion n'existe pour les calibrer : on ne sait pas
# quels leads se transforment. Presenter cette grille comme un modele
# laisserait croire a une validation empirique qui n'a pas eu lieu.
#
# Ce fichier est charge au runtime, jamais importe. Recalibrer la grille ne
# doit toucher aucun fichier .py.

version = 1
date_calibration = "2026-08-15"
methode = "a dire d'expert — aucune donnee de conversion disponible"

# La somme des poids fait 100 : le score est directement lisible sur 0-100.

[montant]
poids = 55
motif = """
Critere dominant : la capacite a engager un ticket de 10 k EUR depend d'abord
du produit de cession encaisse.
"""

# Normalisation LOGARITHMIQUE. Le critere serait sinon lineaire sur une
# distribution qui ne l'est pas (mediane 110 k, max 6,2 M). Le log preserve
# l'ordre et rend lisible l'ecart entre 200 et 400 k EUR, la ou vit le volume.
# Sens metier : 200 -> 400 k change la capacite d'investissement, 5 -> 6 M non.
echelle = "log"

# En dessous, contribution nulle : un fonds cede sous ce prix ne finance pas
# un ticket de private equity.
plancher_eur = 10_000

# p99 de la distribution mesuree. CE N'EST PAS UNE SATURATION METIER : ce
# plafond borne une valeur aberrante mal parsee, rien d'autre. Un plafond bas
# rendrait 6,2 M et 1 M equivalents alors que le premier est un meilleur
# prospect — ce serait detruire de l'information.
plafond_eur = 1_580_000

[fraicheur]
poids = 45
motif = """
Le delai est le critere le plus decisif du metier. Une cession de 3 semaines
et une de 11 mois ne sont pas le meme prospect : dans le premier cas le produit
est encore en tresorerie et la decision de placement n'est pas prise, dans le
second l'argent a deja trouve une destination.

45 et non 35 : les 10 points viennent du critere secteur, laisse orphelin
faute de base defendable pour hierarchiser les activites. Voir [secteur].
"""

# DECROISSANCE DES LE PREMIER JOUR, sans plateau.
#
# La version precedente accordait une contribution pleine jusqu'a 18 mois.
# C'etait une fenetre de PERTINENCE COMMERCIALE la ou il fallait un critere de
# DISCRIMINATION : sur une recherche portant sur 12 mois, toute la population
# tombait dans le plateau et la fraicheur ne departageait rien. La correlation
# de rang avec le montant valait alors 0,998.
#
# La forme est configurable, pas en dur :
#   "demi_vie"  -> 0.5 ** (jours / demi_vie_jours)   [defaut]
#   "lineaire"  -> 1 - jours / fenetre_nulle_jours
#
# La demi-vie modelise mieux le phenomene : la probabilite que le cash soit
# encore disponible decroit continument, sans date de bascule.
forme = "demi_vie"
demi_vie_jours = 180
fenetre_nulle_jours = 1096

# Le delai est compte depuis la date d'ACTE quand elle est lisible, depuis la
# parution sinon — l'ecart median est de 33 jours mais p95 atteint 145 jours.
#
# A ne pas confondre avec le seuil de 24 mois du parser : celui-ci tranche la
# QUALITE DE LA DONNEE, celui-la tranche la PERTINENCE COMMERCIALE.

[secteur]
poids = 0
motif = """
POIDS NUL. Le code APE est desormais disponible via l'enrichissement, mais
AUCUNE BASE DEFENDABLE n'existe pour hierarchiser les secteurs : il n'y a pas
de donnee de conversion. Affirmer que la restauration convertit mieux que le
BTP serait inventer un signal — exactement ce qui a ete refuse pour le
departement, et le refuser la puis l'accepter ici serait incoherent.

Pourquoi les 10 points sont reportes, dans cet ordre :

1. Un score sur 100 dont le maximum reel serait 90 est un mensonge d'echelle,
   c'est-a-dire le defaut d'explicabilite exact que ce projet combat. Un poids
   orphelin ne peut pas rester en place.
2. Le report vers la fraicheur est le choix par defaut le moins arbitraire :
   c'est le seul critere dont la ponderation soit motivee metier.

Ce n'est PAS une amelioration du classement : un poids orphelin a ete
redistribue, rien n'a ete calibre.

Le code APE reste collecte et affiche — il sert de metadonnee de segmentation,
et le jour ou un retour de conversion existe, activer ce critere sera une
modification de ce fichier, pas du code.

Si `codes_prioritaires` est rempli, ce poids doit etre repris a un autre
critere pour que la somme reste a 100.
"""

codes_prioritaires = []

[departement]
poids = 0
motif = """
POIDS NUL DELIBEREMENT. Le perimetre PACA est homogene : rien ne justifie de
hierarchiser les six departements entre eux, et fabriquer un ordre 13 > 06 > 83
serait inventer un signal. Le critere reste declare, pret a servir si le
perimetre s'elargit a d'autres regions.
"""

departements_prioritaires = []

[controle]
# Correlation de rang entre le classement de la grille et le classement par
# montant seul, mesuree sur les seuls evenements RETENUS.
#
# Ce seuil DECLENCHE UN AVERTISSEMENT, pas un echec. Si la correlation reste
# elevee apres le passage en log, on ne retouche pas les poids pour faire
# passer un test : on documente que sur une population filtree a plus de
# 200 k EUR, le montant domine et les autres criteres departagent a montant
# comparable. C'est une conclusion valide.
correlation_montant_avertissement = 0.90

# Ce qui doit VRAIMENT etre garanti : a montant egal, les autres criteres
# separent deux evenements. Sinon ils sont du code mort.
ecart_minimal_a_montant_egal = 1.0
